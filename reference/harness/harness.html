<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Reference harness (tested during planning). Local file for headless rendering only — never
// served by the site (its inline script/style would violate the production CSP anyway).
// Minimal WebGL2 runner: renders a list of passes; each pass = fragment shader; optional FBO target.
window.runPasses = async function(cfg){
  const cv = document.getElementById('c');
  cv.width = cfg.width; cv.height = cfg.height;
  cv.style.width = cfg.width + 'px'; cv.style.height = cfg.height + 'px';
  const gl = cv.getContext('webgl2', {antialias:false, preserveDrawingBuffer:true, premultipliedAlpha:false});
  if(!gl) throw new Error('no webgl2');
  const vs = `#version 300 es
  in vec2 aPos; void main(){ gl_Position = vec4(aPos,0.,1.); }`;
  function compile(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n')); return s; }
  function program(fs){ const p=gl.createProgram(); gl.attachShader(p,compile(gl.VERTEX_SHADER,vs)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs)); gl.bindAttribLocation(p,0,'aPos'); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const targets = {};
  for (const pass of cfg.passes){
    const p = program(pass.fs); gl.useProgram(p);
    let w = cfg.width, h = cfg.height, fbo = null;
    if (pass.target){
      w = Math.round(cfg.width * (pass.scale||1)); h = Math.round(cfg.height * (pass.scale||1));
      const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      targets[pass.target] = {tex, w, h};
    } else gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,w,h);
    const U = pass.uniforms || {};
    U.uRes = [w, h];
    let unit = 0;
    for (const [k,v] of Object.entries(U)){
      const loc = gl.getUniformLocation(p,k); if(loc===null) continue;
      if (typeof v === 'string' && targets[v]) { gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, targets[v].tex); gl.uniform1i(loc, unit); unit++; }
      else if (typeof v === 'number') gl.uniform1f(loc, v);
      else if (v.length===2) gl.uniform2fv(loc, v); else if (v.length===3) gl.uniform3fv(loc, v); else if (v.length===4) gl.uniform4fv(loc, v);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.finish();
  return 'ok';
};
</script></body></html>
